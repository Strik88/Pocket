[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pocket-bridge"
version = "1.0.1"
description = "Sync Pocket recordings to local Markdown, organised per client, and talk to them with Claude via MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "anthropic>=1.11",
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "icalendar>=6",
  "recurring-ical-events>=3",
  "numpy>=1.26",
  "fastembed>=0.5",
  "pystray>=0.19",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pocket-bridge = "pocket_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
